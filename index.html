<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title>Diário do Atleta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de uma coluna, feito para o celular. Cabeçalho, 4 etapas (Pause, Perceba, Escolha, Avalie), conteúdo e barra inferior com Plano, Sons e Histórico. */
:root{
  --bg:#EAF0EF; --surface:#F8FBFA; --fg:#10262B; --muted:#4D6569; --line:#C6D8D6;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#CDE8E6; --signal:#C77E10; --signal-soft:#F7E6C6;
  --good:#1F7A4D; --good-soft:#D3EBDD;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B191D; --surface:#12282D; --fg:#E3F0EE; --muted:#93AFB0; --line:#244149;
    --accent:#5CC4C8; --accent-ink:#052428; --accent-soft:#17383D; --signal:#F0B65A; --signal-soft:#3A2F17;
    --good:#6CCB98; --good-soft:#163425; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B191D; --surface:#12282D; --fg:#E3F0EE; --muted:#93AFB0; --line:#244149;
  --accent:#5CC4C8; --accent-ink:#052428; --accent-soft:#17383D; --signal:#F0B65A; --signal-soft:#3A2F17;
  --good:#6CCB98; --good-soft:#163425; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--body);
  padding-block:12px 112px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font:800 clamp(28px,8vw,38px)/1.05 var(--display);letter-spacing:-.02em;text-wrap:balance}
h2{font:700 18px/1.2 var(--display);letter-spacing:-.01em}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--muted);max-width:60ch}
.small{font-size:14px;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#hdr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:800 15px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--accent)}
.live{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--accent);background:var(--accent-soft);
  border-radius:999px;padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.steps li{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font:600 12px/1.1 var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.steps .bar{height:5px;border-radius:3px;background:var(--line)}
.steps li.done .bar{background:var(--accent)}
.steps li.cur .bar{background:var(--accent)}
.steps li.cur{color:var(--fg)}
.steps b{font-weight:700}

main{display:flex;flex-direction:column;gap:18px;min-width:0}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{background:var(--signal-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.note b{font-family:var(--display);font-size:17px}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:9px 15px;border:1.5px solid var(--line);
  background:var(--surface);border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip.static{cursor:default;min-height:38px;padding:6px 12px;font-size:14px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.big-chips .chip{font-size:16px;min-height:50px;padding:10px 16px}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{min-height:48px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font:700 18px var(--display);cursor:pointer}
.scale button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.scale-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 22px;border-radius:14px;border:0;
  background:var(--accent);color:var(--accent-ink);font:700 16px var(--body);cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btnrow .btn{flex:1 1 140px}
.back{align-self:flex-start;background:none;border:0;color:var(--accent);font:600 15px var(--body);padding:6px 0;cursor:pointer}

label.lbl{font:600 15px var(--body)}
input[type=text],textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
textarea{resize:vertical;min-height:76px}
input[type=range]{width:100%;accent-color:var(--accent)}

.strat{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:14px 16px;
  border:1.5px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer}
.strat.top{border-color:var(--accent)}
.strat b{display:block;font:700 17px/1.2 var(--display)}
.strat small{color:var(--muted);font-size:14px}
.tag{font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:5px 9px;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:10px}
details summary{cursor:pointer;font-weight:600;padding:6px 0;color:var(--accent)}

.orbwrap{height:min(64vw,250px);display:grid;place-items:center}
.orb{width:min(64vw,250px);max-width:100%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--accent-soft),var(--accent));
  transform:scale(.62);transition:transform 4s ease-in-out}
.orblabel{text-align:center;font:700 22px var(--display)}
.cd{text-align:center;font:800 44px var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.bigtext{font:700 clamp(22px,6vw,28px)/1.25 var(--display);text-wrap:balance}
.phrase{font:800 clamp(26px,7.5vw,34px)/1.1 var(--display);text-align:center;padding:22px 8px;text-wrap:balance}

.steprow{display:flex;gap:10px;align-items:center}
.steprow input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none}

.snd{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:14px 16px;
  border:1.5px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer}
.snd b{display:block;font:700 17px var(--display)}
.snd small{color:var(--muted);font-size:14px}
.snd.on{border-color:var(--accent);background:var(--accent-soft)}
.pill{font:700 12px/1 var(--body);border-radius:999px;padding:6px 10px;border:1.5px solid var(--line);white-space:nowrap}
.snd.on .pill{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--signal-soft);color:var(--signal);border-color:transparent}
.sndpanel{display:flex;flex-direction:column;gap:14px}
.sndlist{display:flex;flex-direction:column;gap:10px}

.entry{display:flex;flex-direction:column;gap:8px}
.entry .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.entry .who{display:flex;align-items:center;gap:8px;font:700 18px/1.2 var(--display)}
.entry .when{font-size:13px;color:var(--muted);margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.arrow{font-variant-numeric:tabular-nums;font-weight:700}
.sample{border-style:dashed}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
textarea.ficha{min-height:220px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabbar button{position:relative;min-height:48px;border:0;background:none;border-radius:12px;font:700 14px var(--body);color:var(--muted);cursor:pointer}
.tabbar button[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.badge{position:absolute;top:4px;right:18%;background:var(--signal);color:#fff;border-radius:999px;font:700 11px/1 var(--body);padding:4px 6px}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(84px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);z-index:9}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){
  .orb{transition:none!important}.live i{animation:none}.toast{transition:none}
}
</style>
</head>
<body>

<div class="app">
  <header id="hdr"></header>
  <ol class="steps" id="stepper" aria-label="Etapas do plano"></ol>
  <main id="main"></main>
</div>
<nav class="tabbar" aria-label="Seções do app"><div class="in" id="tabbar"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- ortografia: primeira letra maiúscula e ponto final ---------- */
function cap(s){s=String(s==null?'':s).replace(/\s+/g,' ').trim();return s?s.charAt(0).toUpperCase()+s.slice(1):''}
function sent(s){s=cap(s);if(s&&!/[.!?…]$/.test(s))s+='.';return s}

/* ---------- armazenamento (somente neste aparelho) ---------- */
/* A chave é a mesma da versão anterior, para não perder registros já feitos. */
var K_E='mpp.v1.entries', mem={};
function lsGet(k,def){try{var v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}return (k in mem)?mem[k]:def}
function lsSet(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- conteúdo ---------- */
/* g: d = desafiadora, p = positiva, o = outras. Cada emoção tem sinais, dicas, estratégias e frases próprios. */
var EMOTIONS=[
 {id:'ansiedade',g:'d',label:'Ansiedade',c:'#E0A030',
  note:'Sentir ansiedade antes de competir é comum. O objetivo não é eliminá-la, e sim decidir como agir mesmo assim.',
  tips:['Volte a atenção para o que você controla agora: respiração, postura e a próxima ação.','Faça respirações longas, soltando o ar mais devagar do que puxa.','Troque “e se der errado?” por “o que eu faço agora?”.'],
  signs:['pensamentos','coracao','tensao','resultado','distracao','travado'],
  base:['respirar','mindful','frase','etapas','relax','apoio','sons'],
  phr:['Uma ação de cada vez.','Eu me preparei para isso.','Respiro e volto ao que eu controlo.'],
  ph:'Ex.: primeira ação técnica, posição dos pés ou olhar para o alvo.'},
 {id:'nervosismo',g:'d',label:'Nervosismo',c:'#E58F3C',
  note:'O nervosismo é uma energia de alerta antes de algo importante. Ele mostra que isso importa para você.',
  tips:['Mexa o corpo de forma leve: balance os braços, caminhe e solte as mãos.','Repita a rotina de preparação que você já conhece, passo a passo.','Respire soltando o ar devagar, duas ou três vezes.'],
  signs:['coracao','tensao','pensamentos','pressa','distracao'],
  base:['respirar','etapas','relax','frase','mindful','apoio','sons'],
  phr:['Sigo a minha rotina.','Nervosismo também é energia.','Um passo de cada vez.'],
  ph:'Ex.: seguir a minha rotina de aquecimento.'},
 {id:'medo',g:'d',label:'Medo de errar',c:'#8E7CC3',
  note:'O medo de errar puxa a atenção para o resultado. Vale trazer o foco de volta para a próxima ação.',
  tips:['Traga o foco do resultado para a próxima ação, uma de cada vez.','Lembre que errar faz parte do aprendizado e não define quem você é.','Prepare um plano para depois do erro: o que farei se acontecer?'],
  signs:['resultado','erro','autocritica','travado','cobranca','pensamentos'],
  base:['frase','etapas','respirar','apoio','mindful','relax','sons'],
  phr:['Foco na próxima ação.','Errar faz parte de aprender.','Faço o que treinei.'],
  ph:'Ex.: olhar para o alvo e executar o primeiro movimento.'},
 {id:'inseguranca',g:'d',label:'Insegurança',c:'#9C8BB8',
  note:'A insegurança aparece quando a mente duvida da própria capacidade. Dúvida não é prova de que você não consegue.',
  tips:['Lembre de três situações em que você se saiu bem.','Foque no que você já treinou, e não no que ainda falta.','Converse com o treinador ou com a psicóloga sobre o que está gerando a dúvida.'],
  signs:['duvida','comparacao','autocritica','cobranca','resultado'],
  base:['reforco','frase','apoio','etapas','respirar','mindful','acolher'],
  phr:['Eu treinei para isso.','Já fiz isso antes.','Sou capaz de dar o próximo passo.'],
  ph:'Ex.: lembrar uma execução que deu certo e repetir o gesto.'},
 {id:'pressao',g:'d',label:'Pressão por resultado',c:'#B8704A',
  note:'A pressão costuma vir de dentro e de fora: metas, plateia, treinador, família. Ela pesa menos quando você separa o que controla do que não controla.',
  tips:['Anote o que depende de você e o que não depende.','Escolha uma meta de processo, como execução ou postura, em vez de só o resultado.','Se a cobrança vem de alguém, converse sobre isso com uma pessoa de confiança.'],
  signs:['cobranca','resultado','comparacao','tensao','pensamentos','duvida'],
  base:['frase','etapas','apoio','respirar','mindful','relax','sons'],
  phr:['Foco no processo.','Faço a minha parte.','O que eu controlo, eu faço.'],
  ph:'Ex.: meta de processo, como manter o ritmo ou a técnica.'},
 {id:'estresse',g:'d',label:'Estresse',c:'#C7803C',
  note:'O estresse se acumula com treino, estudo, rotina e sono. Pausas curtas ajudam o corpo a baixar o ritmo.',
  tips:['Faça uma pausa curta e solte ombros, mandíbula e mãos.','Liste o que é urgente hoje e deixe o resto para depois.','Cuide do básico: água, comida e descanso.'],
  signs:['tensao','irritavel','pensamentos','sono','distracao','cansaco'],
  base:['relax','respirar','mindful','etapas','sons','apoio','acolher'],
  phr:['Uma coisa de cada vez.','Faço uma pausa e volto.','Solto o que não preciso carregar agora.'],
  ph:'Ex.: terminar o treino de hoje e deixar o resto para depois.'},
 {id:'raiva',g:'d',label:'Raiva',c:'#D9604C',
  note:'A raiva traz energia. O passo é direcioná-la sem perder o controle da próxima ação.',
  tips:['Antes de agir, espere alguns segundos e respire soltando o ar devagar.','Use a energia em algo útil: um movimento firme e controlado, e não um impulso.','Se for seguro, afaste-se por um instante da situação.'],
  signs:['irritavel','tensao','coracao','erro','pensamentos','cobranca'],
  base:['respirar','relax','frase','canalizar','apoio','etapas','mindful'],
  phr:['Solto os ombros e volto ao movimento.','Energia a meu favor.','Calma e firmeza.'],
  ph:'Ex.: respirar uma vez e executar o próximo movimento com controle.'},
 {id:'frustracao',g:'d',label:'Frustração',c:'#C9668A',
  note:'A frustração costuma vir depois de um erro ou de algo que não saiu como esperado. A próxima tentativa é uma nova informação.',
  tips:['Reconheça o que não saiu como esperado, sem se culpar.','Escolha um único ajuste para a próxima tentativa.','Lembre que o erro é uma informação, e não uma sentença.'],
  signs:['erro','autocritica','irritavel','desistir','resultado','tensao'],
  base:['etapas','frase','respirar','acolher','apoio','mindful','relax'],
  phr:['Próxima tentativa, nova chance.','Aprendo e sigo.','Um ajuste de cada vez.'],
  ph:'Ex.: um ajuste técnico para a próxima tentativa.'},
 {id:'tristeza',g:'d',label:'Tristeza',c:'#5E86B5',care:true,
  note:'A tristeza pode aparecer depois de uma derrota, de uma perda ou sem um motivo claro. Ela merece cuidado, e não pressa.',
  tips:['Permita-se sentir, sem se cobrar para melhorar rápido.','Fale com alguém de confiança ou com a psicóloga.','Faça algo pequeno que costuma fazer bem: caminhar, ouvir música ou conversar com um amigo.'],
  signs:['choro','isolar','cansaco','desistir','sono','autocritica'],
  base:['acolher','apoio','sons','respirar','etapas','frase','mindful'],
  phr:['Posso sentir isso e pedir ajuda.','Um passo pequeno já é um passo.','Não preciso estar bem o tempo todo.'],
  ph:'Ex.: algo pequeno que eu consigo fazer agora.'},
 {id:'cansaco',g:'d',label:'Cansaço',c:'#7F95A3',
  note:'O cansaço pode ser do corpo, da mente ou dos dois. Descansar também faz parte do desempenho.',
  tips:['Verifique o básico: sono, água e alimentação.','Reduza a tarefa ao mínimo necessário agora.','Se o cansaço for frequente, avise o treinador e a psicóloga.'],
  signs:['cansaco','sono','desistir','distracao','irritavel'],
  base:['relax','sons','etapas','acolher','respirar','apoio','mindful'],
  phr:['Descansar também é treinar.','Faço o essencial agora.','Escuto o meu corpo.'],
  ph:'Ex.: fazer só o essencial e descansar depois.'},
 {id:'culpa',g:'d',label:'Culpa',c:'#A06A8C',care:true,
  note:'A culpa aparece quando sentimos que falhamos com alguém ou com nós mesmos. Ela pode indicar o que é importante para você, mas não precisa virar punição.',
  tips:['Pergunte-se o que está sob o seu controle e o que dá para reparar.','Se fizer sentido, fale com a pessoa envolvida ou com alguém de confiança.','Trate-se com o mesmo respeito que daria a um colega.'],
  signs:['autocritica','erro','pensamentos','isolar','cobranca'],
  base:['acolher','frase','apoio','etapas','respirar','mindful','relax'],
  phr:['Aprendo com isso e sigo.','Posso reparar o que for possível.','Errar não me define.'],
  ph:'Ex.: uma atitude para reparar ou aprender com isso.'},
 {id:'vergonha',g:'d',label:'Vergonha',c:'#B5788A',care:true,
  note:'A vergonha faz a gente querer se esconder depois de uma situação exposta. Quase todo atleta passa por isso em algum momento.',
  tips:['Em geral, os outros pensam no episódio bem menos do que parece.','Respire e volte a atenção para a próxima ação.','Converse com alguém de confiança sobre o que aconteceu.'],
  signs:['autocritica','isolar','comparacao','erro','travado'],
  base:['acolher','frase','apoio','respirar','etapas','mindful','relax'],
  phr:['Um erro não define quem eu sou.','Eu sigo em frente.','Posso voltar de cabeça erguida.'],

 /* No iPhone, o som de páginas web é silenciado pelo modo silencioso. Tocar um áudio mudo em loop e pedir a categoria "playback" faz o som sair normalmente. */
 keepAlive:function(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{
   if(!this.keep){
    var n=8000,u=new Uint8Array(44+n),v=new DataView(u.buffer),i;

    w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
    for(i=0;i<n;i++)u[44+i]=128;
    var a=new Audio(URL.createObjectURL(new Blob([u],{type:'audio/wav'})));a.loop=true;a.setAttribute('playsinline','');this.keep=a;
   }
   var pr=this.keep.play();if(pr&&pr.catch)pr.catch(function(){});
  }catch(e){}
 },
 init:function(){
  this.keepAlive();
  if(!this.ctx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
   try{this.ctx=new AC();}catch(e){return false}
   this.master=this.ctx.createGain();this.master.gain.value=this.vol;this.master.connect(this.ctx.destination);
   try{var ub=this.ctx.createBuffer(1,1,22050),us=this.ctx.createBufferSource();us.buffer=ub;us.connect(this.ctx.destination);us.start(0)}catch(e){}}
  if(this.ctx.state==='suspended'){try{this.ctx.resume()}catch(e){}}
  return true;},
 buf:function(kind){var c=this.ctx,n=c.sampleRate*4,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0),last=0,i;
  for(i=0;i<n;i++){var w=Math.random()*2-1;if(kind==='brown'){last=(last+0.02*w)/1.02;d[i]=last*3.5}else{d[i]=w*0.5}}
  var f=Math.floor(c.sampleRate*.05);for(i=0;i<f;i++){var k=i/f;d[i]*=k;d[n-1-i]*=k}

  var c=this.ctx,g=c.createGain();g.gain.value=0;g.connect(this.master);this.gain=g;

   var s=this.loop('white'),hp=c.createBiquadFilter(),lp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=600;lp.type='lowpass';lp.frequency.value=6500;
   s.connect(hp);hp.connect(lp);lp.connect(g);s.start();

   var b=this.loop('brown'),lp2=c.createBiquadFilter(),wg=c.createGain(),lfo=this.osc(0.09),lg=c.createGain();
   lp2.type='lowpass';lp2.frequency.value=800;wg.gain.value=.55;lg.gain.value=.4;

   lp3.connect(pg);pg.connect(g);
  }

/* Ordem das estratégias: depende da emoção escolhida e dos sinais marcados. */
function rank(){

function dateLong(ts){try{return cap(new Date(ts).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}))}catch(e){return ''}}
function timeStr(ts){try{return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function fmtDate(ts){return dateLong(ts)+' às '+timeStr(ts)}
function dayKey(ts){var x=new Date(ts);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()}
function dayLabel(ts){
 var now=Date.now(),k=dayKey(ts);
 if(k===dayKey(now))return 'Hoje · '+dateLong(ts);
 if(k===dayKey(now-86400000))return 'Ontem · '+dateLong(ts);
 return dateLong(ts);
}

function fichaText(){
 var list=entries.slice().sort(function(a,b){return a.ts-b.ts});

 if(list.length)out.push('Período: '+dateLong(list[0].ts)+' a '+dateLong(list[list.length-1].ts));
 var top=emoCounts().slice(0,5).map(function(x){return x.label+' ('+x.n+')'}).join(', ');
 if(top)out.push('Emoções mais registradas: '+top);
 out.push('');
 var lastDay='';
 list.forEach(function(e){
  var dk=dayKey(e.ts),done=isEval(e);
  if(dk!==lastDay){if(lastDay)out.push('');out.push('=== '+dateLong(e.ts)+' ===');lastDay=dk}
  out.push(timeStr(e.ts)+' · '+(e.ctx||'Sem momento definido'));
  out.push('Emoção: '+emo(e.emotion).label+' (intensidade '+e.intensity+(done?' → '+(e.depois||e.intensity):'')+')');
  if(e.others&&e.others.length)out.push('Também senti: '+e.others.map(function(id){return emo(id).label}).join(', '));
  if(e.signs&&e.signs.length)out.push('O que percebi: '+signLabels(e.signs));
  if(e.focus)out.push('Foco escolhido: '+sent(e.focus));
  if(e.strategy){
   out.push('Estratégia: '+(STRATS[e.strategy]?STRATS[e.strategy].t:'')+(e.frase?' · frase: '+sent(e.frase):''));
   out.push(e.pending?'Avaliação: pendente':'Usei: '+(USEI[e.usei]||'não informado')+' · Ajudou: '+(HELP[e.ajudou]||'não informado')+(e.evTs?' · avaliado em '+fmtDate(e.evTs):''));
  }else{
   out.push('Estratégia: nenhuma escolhida (só o registro da emoção).');
  }
  if(e.funcionou)out.push('O que funcionou: '+sent(e.funcionou));
  if(e.ajustar)out.push('O que ajustar: '+sent(e.ajustar));
  out.push('');
 });
 return out.join('\n');
}

  if(c===0){orb.style.transitionDuration='4s';orb.style.transform='scale(1)';lab.textContent='Inspire pelo nariz'}
  if(c===4){orb.style.transitionDuration='6s';orb.style.transform='scale(.62)';lab.textContent='Solte o ar devagar'}
  cnt.textContent=total-t;t++;
  if(t>total){stopTimers();lab.textContent='Pronto. Como você está agora?';cnt.textContent='0';btn.textContent='Repetir'}

 stopTimers();
 if(practice.kind==='frase')d.frase=sent(practice.phrase);
 if(practice.kind==='etapas')d.etapas=practice.texts.map(cap).filter(function(x){return x});
 upsertEntry();screen='depois';render();
}
function go(s){screen=s;render()}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev0){
 var el=ev0.target.closest('[data-a]');if(!el)return;
 var a=el.getAttribute('data-a'),id=el.getAttribute('data-id'),i=parseInt(el.getAttribute('data-i'),10);
 switch(a){
  case 'tab':tab=id;render();break;
  case 'emo':
   if(d.emotion!==id){d.emotion=id;d.signs=[];d.others=d.others.filter(function(x){return x!==id})}
   render(true);break;
  case 'ctx':d.ctx=(d.ctx===id)?'':id;render(true);break;
  case 'to-perceba':if(d.emotion){othOpen=false;upsertEntry();go('perceba')}break;
  case 'to-pause':go('pause');break;
  case 'sign':var k=d.signs.indexOf(id);if(k>-1)d.signs.splice(k,1);else d.signs.push(id);upsertEntry();render(true);break;
  case 'oth':var o=d.others.indexOf(id);if(o>-1)d.others.splice(o,1);else d.others.push(id);othOpen=true;upsertEntry();render(true);break;
  case 'int':d.intensity=parseInt(id,10);upsertEntry();render(true);break;
  case 'to-escolha':upsertEntry();go('escolha');break;
  case 'strat':d.strategy=id;upsertEntry();practice=initPractice(id);go('pratica');break;
  case 'breath':if(timers.length){stopTimers();$('#breathBtn').textContent='Retomar'}else{startBreath()}break;
  case 'phrase':practice.phrase=emo(d.emotion).phr[i];render(true);break;
  case 'chk':practice.checks[i]=el.checked;break;
  case 'run-prev':if(practice.i>0){practice.i--;render()}break;
  case 'run-next':if(practice.i<RUN[practice.kind].steps.length-1){practice.i++;render()}else{finish()}break;
  case 'finish':finish();break;
  case 'eval-now':ev=newEv(d.entryId);go('avaliar');break;
  case 'eval-later':toast('Registro salvo. Avalie quando quiser.');d=newDraft();tab='historico';screen='pause';render();break;
  case 'eval-open':ev=newEv(id);tab='plano';screen='avaliar';render();break;
  case 'ev':ev[el.getAttribute('data-key')]=id;render(true);break;
  case 'ev-int':ev.depois=parseInt(id,10);render(true);break;
  case 'ev-save':saveEv();break;
  case 'new':d=newDraft();othOpen=false;tab='plano';screen='pause';render();break;
  case 'snd':if(!Snd.play(id)){toast('Não foi possível tocar áudio neste navegador.')}updateSoundUI();break;
  case 'snd-timer':Snd.timerMin=parseInt(id,10);if(Snd.current){var cur=Snd.current;Snd.current=null;Snd.play(cur)}updateSoundUI();break;
  case 'copy':copyFicha();break;
  case 'download':downloadFicha();break;
  case 'clear-ask':clearAsk=true;render();break;
  case 'clear-no':clearAsk=false;render();break;
  case 'clear-yes':entries=[];lsSet(K_E,entries);clearAsk=false;toast('Registros apagados.');render();break;
 }
});
function newEv(id){var e=entries.filter(function(x){return x.id===id})[0]||{};return {id:id,usei:e.usei||'',depois:e.depois||e.intensity||3,ajudou:e.ajudou||'',funcionou:e.funcionou||'',ajustar:e.ajustar||''}}
function saveEv(){
 var e=entries.filter(function(x){return x.id===ev.id})[0];if(!e)return;
 e.usei=ev.usei;e.depois=ev.depois;e.ajudou=ev.ajudou;e.funcionou=sent(ev.funcionou);e.ajustar=sent(ev.ajustar);e.pending=false;e.evTs=Date.now();
 lsSet(K_E,entries);toast('Avaliação salva.');d=newDraft();tab='historico';screen='pause';render();
}
function copyFicha(){
 var txt=fichaText();
 function fallback(){var det=$('#fichaDet');if(det)det.open=true;var t=$('#ficha');if(t){t.focus();t.select()}toast('Selecione o texto e copie.')}
 try{navigator.clipboard.writeText(txt).then(function(){toast('Ficha copiada.')},fallback)}catch(e){fallback()}
}
function downloadFicha(){
 try{
  var n=new Date(),p=function(x){return (x<10?'0':'')+x};
  var name='diario-do-atleta-'+n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+'.txt';
  var blob=new Blob(['﻿'+fichaText()],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)},500);
  toast('Ficha baixada.');
 }catch(e){var det=$('#fichaDet');if(det)det.open=true;toast('Não foi possível baixar. Use Copiar ficha.')}
}
document.addEventListener('input',function(e){
 var t=e.target,k=t.getAttribute&&t.getAttribute('data-k');
 if(t.id==='vol'){Snd.setVol(t.value/100);return}
 if(!k)return;
 if(k==='focus')d.focus=t.value;
 else if(k==='myphrase'){practice.phrase=t.value;var b=$('#bigphrase');if(b)b.textContent=t.value||'Escolha ou escreva uma frase curta.'}
 else if(k==='etapa')practice.texts[parseInt(t.getAttribute('data-i'),10)]=t.value;
 else if(k==='reflect')practice.reflect=t.value;
 else if(k==='funcionou'||k==='ajustar')ev[k]=t.value;
});
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
